<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palais Brongniart · chorégraphie des drones</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #050818; overflow: hidden; font-family: "Overpass Mono", ui-monospace, Menlo, monospace; color: #cfd6ff; }
  #app { position: fixed; inset: 0; }
  #top { position: fixed; left: 20px; top: 16px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #8ea2ff; }
  #tab { position: fixed; left: 20px; bottom: 70px; font-size: 24px; color: #fff; }
  #tab small { display: block; font-size: 12px; color: #8ea2ff; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 8px; }
  #bar { position: fixed; left: 20px; right: 20px; bottom: 16px; display: flex; gap: 10px; align-items: center; font-size: 12px; }
  #bar button { font: inherit; color: #cfd6ff; background: rgba(20,28,82,.72); border: 1px solid #3b4bb8; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  #bar button.on { background: #1f3fff; color: #fff; border-color: #1f3fff; }
  #bar input { flex: 1; accent-color: #1f3fff; min-width: 60px; }
  #clock { white-space: nowrap; }
  #chk { position: fixed; right: 20px; top: 16px; font-size: 12px; line-height: 1.8; text-align: right; background: rgba(8,12,40,.62); border: 1px solid #2a3690; padding: 10px 14px; white-space: nowrap; }
  #chk b { color: #fff; font-weight: 500; } #chk .bad { color: #ff6a5c; }
  body.bare #bar, body.bare #chk { display: none; } body.bare #tab { bottom: 20px; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.167.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/" } }</script>
</head>
<body>
<div id="app"></div><div id="top"></div><div id="tab"></div><div id="chk"></div>
<div id="bar"><button id="play">Pause</button><button data-s="souffle">Le Souffle</button><button data-s="bulle">La Bulle</button><button data-s="jardin">Le Jardin</button><input id="tl" type="range" min="0" max="1000" value="0"><span id="clock"></span><button id="exp">Exporter les trajectoires</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search), N = Math.max(200, +(Q.get('n') || 1200));
if (Q.get('ui') === '0') document.body.classList.add('bare');
const SEP = 1.5, VMAX = 6, HOLD = 5;                 // écart mini admis (m), vitesse plafond (m/s), tenue d'un tableau (s)

// ---------------------------------------------------------------- 1. le palais, aux cotes de l'élévation (mètres)
const B = { total: 78.7, platform: 49.5, bay: 3.56, base: 2.75, column: 11.8, entab: 2.9, attic: 1.4 };
const TOPC = B.base + B.column, TOPE = TOPC + B.entab, TOPA = TOPE + B.attic, half = B.platform / 2, WALL = -4.2;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); $('app').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#050818'); scene.fog = new THREE.Fog('#050818', 170, 460);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .1, 1400); camera.position.set(-14, 5, 122);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 38, 0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2 - .02; controls.update();
scene.add(new THREE.HemisphereLight('#4455cc', '#0a0d24', .8));
const stone = new THREE.MeshStandardMaterial({ color: '#b9b2a3', roughness: .95 }), dark = new THREE.MeshStandardMaterial({ color: '#8d877b', roughness: 1 }), lit = new THREE.MeshBasicMaterial({ color: '#ffd98a' });
const box = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h / 2, z); scene.add(o); return o; };
{ const g = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ color: '#12152a', roughness: 1 })); g.rotation.x = -Math.PI / 2; scene.add(g); }
box(B.total, B.base, 40, stone, 0, 0, WALL - 18); box(B.platform + .6, TOPA, 36, stone, 0, 0, WALL - 18); box(B.platform, B.column, .4, dark, 0, B.base, WALL + .2);
for (let i = 0; i < 13; i++) for (const y of [B.base + 2.2, B.base + 7.2]) box(1.6, 3.6, .1, lit, (i - 6) * B.bay, y, WALL + .46);
{ const sh = new THREE.CylinderGeometry(.5, .58, B.column - 1.6, 20), cap = new THREE.BoxGeometry(1.6, 1.0, 1.6), pl = new THREE.BoxGeometry(1.5, .6, 1.5);
  for (let i = 0; i < 14; i++) { const x = (i - 6.5) * B.bay;
    for (const [g, y] of [[pl, .3], [sh, .6 + (B.column - 1.6) / 2], [cap, B.column - .5]]) { const m = new THREE.Mesh(g, stone); m.position.set(x, B.base + y, -1.1); scene.add(m); }
    if (i % 2 === 0) { const l = new THREE.PointLight('#ffcf7a', 30, 18, 1.5); l.position.set(x + B.bay / 2, B.base + .5, 1.4); scene.add(l); } } }
box(B.platform + 1.2, B.entab, 6, stone, 0, TOPC, -2.4); box(B.platform + .4, B.attic, 5.2, stone, 0, TOPE, -2.6);
for (const s of [-1, 1]) box((B.total - B.platform) / 2, TOPE, 22, stone, s * (half + (B.total - B.platform) / 4), 0, -11.6);
for (let i = 0; i < 10; i++) box(B.platform - 2, B.base / 10, .42 * (10 - i) + 1.5, dark, 0, i * B.base / 10, (.42 * (10 - i) + 1.5) / 2 - .2);

// ---------------------------------------------------------------- 2. les drones
const tex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.22, 'rgba(255,255,255,.6)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const cloudPts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 3.0, map: tex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); cloudPts.frustumCulled = false; scene.add(cloudPts);

// ---------------------------------------------------------------- 3. les formations (chaque point est à plus de 1,5 m de ses voisins)
const BUL = [1, .86, .58], WH = [1, 1, 1], BLU = [.5, .6, 1], PNK = [1, .45, .72], GRN = [.4, .95, .55], RED = [1, .32, .28], DIM = [.13, .17, .42];
const rnd = (a => () => (a = (a * 16807) % 2147483647) / 2147483647)(1826);
const F5 = { 1: '00100011000010000100001000010001110', 8: '01110100011000101110100011000101110', 2: '01110100010000100010001000100011111', 6: '00110010001000011110100011000101110', 0: '01110100011001110101110011000101110' };
function fill(P, C) {                              // les drones en trop forment une nappe d'étoiles, haute et pâle
  P = P.slice(0, N); C = C.slice(0, N); const m = N - P.length, nx = Math.ceil(Math.sqrt(m * 3.4)) || 1;
  for (let i = 0; i < m; i++) { const a = i % nx, b = Math.floor(i / nx); P.push([(a - (nx - 1) / 2) * 3.6, 92 + ((a + b) % 2) * 1.4, -30 + b * 3.6]); C.push(DIM); }
  return { P, C }; }
function date(txt) { const o = [], c = 4.4, W = txt.length * 6 * c;
  [...txt].forEach((ch, k) => { for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++) if (F5[ch][r * 5 + q] === '1') for (const [u, v] of [[-.24, -.24], [.24, -.24], [-.24, .24], [.24, .24]]) o.push([-W / 2 + (k * 6 + q + .5 + u) * c, 30 + (6 - r + v) * c, 14]); });
  return fill(o, o.map(() => WH)); }
function grid(w, d, f) { const nx = Math.ceil(Math.sqrt(N * w / d)), ny = Math.ceil(N / nx), o = []; for (let i = 0; i < N; i++) { const a = i % nx, b = Math.floor(i / nx); o.push(f((a / (nx - 1) - .5) * w, b / (ny - 1) * d)); } return o; }
function ball(n, R, cy, sq = 1) { const o = []; for (let i = 0; i < n; i++) { const z = 1 - 2 * (i + .5) / n, t = i * 2.39996, q = Math.sqrt(1 - z * z); o.push([R * q * Math.cos(t), cy + R * z * sq, 18 + R * q * Math.sin(t) * .85]); } return o; }
function along(ctl, sp) { const P = []; for (let i = 0; i < ctl.length - 1; i++) { const a = ctl[Math.max(0, i - 1)], b = ctl[i], c = ctl[i + 1], e = ctl[Math.min(ctl.length - 1, i + 2)];
    for (let j = 0; j < 40; j++) { const t = j / 40, t2 = t * t, t3 = t2 * t; P.push([0, 1, 2].map(k => .5 * (2 * b[k] + (c[k] - a[k]) * t + (2 * a[k] - 5 * b[k] + 4 * c[k] - e[k]) * t2 + (3 * b[k] - a[k] - 3 * c[k] + e[k]) * t3))); } }
  const o = [P[0]]; for (const q of P) if (Math.hypot(q[0] - o.at(-1)[0], q[1] - o.at(-1)[1], q[2] - o.at(-1)[2]) >= sp) o.push(q); return o; }
function bloom(cx, cy, cz, r) { const o = []; for (let p = 0; p < 6; p++) { const a = p * Math.PI / 3; for (let k = 0; k < 11; k++) { const u = k / 11 * 2 * Math.PI, x = .66 * r + .42 * r * Math.cos(u), y = .26 * r * Math.sin(u); o.push([cx + x * Math.cos(a) - y * Math.sin(a), cy + x * Math.sin(a) + y * Math.cos(a), cz]); } }
  const core = []; for (let k = 0; k < 8; k++) core.push([cx + 2.7 * Math.cos(k * Math.PI / 4), cy + 2.7 * Math.sin(k * Math.PI / 4), cz + 3]); return [o, core]; }
const STEMS = [[[-20, 22, 10], [-26, 32, 14], [-18, 42, 12], [-24, 54, 16]], [[0, 22, 10], [5, 32, 16], [-3, 44, 14], [2, 58, 18]], [[20, 22, 10], [27, 30, 14], [19, 40, 12], [26, 50, 16]]];
const FLOW = [[-24, 66, 16, 10.5, PNK], [2, 70, 18, 11, WH], [26, 62, 16, 10.5, RED]];
function garden(open) { const P = [], C = [];
  for (const s of STEMS) for (const q of along(s, 2.0)) for (const dx of [-1.1, 1.1]) { P.push([q[0] + dx, q[1], q[2]]); C.push(GRN); }
  if (open) FLOW.forEach(([x, y, z, r, c]) => { const [pet, core] = bloom(x, y, z, r); pet.forEach(p => { P.push(p); C.push(c); }); core.forEach(p => { P.push(p); C.push([1, .85, .3]); }); });
  return fill(P, C); }
const wave = (A, w) => (p, t) => [p[0], p[1] + A * Math.sin(p[0] * .11 + p[2] * .09 - t * w), p[2]];
const all = (P, c) => ({ P, C: P.map(typeof c === 'function' ? c : () => c) });
const SHOWS = {
  souffle: { name: 'Le Souffle', tabs: [
    { t: '1826', ...date('1826') },
    { t: 'une nappe de lumière', ...all(grid(112, 40, (x, z) => [x, 44, 2 + z]), BLU) },
    { t: 'le vent se lève', ...all(grid(112, 40, (x, z) => [x, 44, 2 + z]), BLU), anim: wave(3, 1.1) },
    { t: 'la vague traverse le ciel', ...all(grid(112, 40, (x, z) => [x, 46, 2 + z]), (p, i) => i % 3 ? BLU : WH), anim: wave(8, 1.8) },
    { t: 'la nappe descend devant le palais', ...all(grid(112, 40, (x, y) => [x, 6 + y, 10]), BLU), anim: (p, t) => [p[0], p[1], p[2] + 1.6 * Math.sin(p[0] * .14 + p[1] * .2 - t * 1.4)] },
    { t: '2026', ...date('2026') }] },
  bulle: { name: 'La Bulle', tabs: [
    { t: '1826', ...date('1826') },
    { t: 'une bulle naît', ...(b => fill(b, b.map(() => BUL)))(ball(Math.round(N / 8), 8.3 * Math.sqrt(N / 1200), 34)) },
    { t: 'elle enfle', ...(b => fill(b, b.map(() => BUL)))(ball(Math.round(N / 2), 14.8 * Math.sqrt(N / 1200), 40)) },
    { t: 'plus grande que le palais', ...all(ball(N, 21.5 * Math.sqrt(N / 1200), 48), BUL), anim: (p, t) => { const k = 1 + .05 * Math.sin(t * 1.3); return [p[0] * k, 48 + (p[1] - 48) * k, 18 + (p[2] - 18) * k]; } },
    { t: 'elle se pose sur le toit', ...all(ball(N, 30 * Math.sqrt(N / 1200), 34, .42), (p, i) => i % 5 ? BUL : WH) },
    { t: '2026', ...date('2026') }] },
  jardin: { name: 'Le Jardin', tabs: [
    { t: '1826', ...date('1826') },
    { t: 'une graine tombe', ...(P => fill(P, P.map((p, i) => i < 20 ? WH : GRN)))([...Array.from({ length: 20 }, (_, i) => [0, 68 - i * 2.2, 14]), ...Array.from({ length: 12 }, (_, i) => [4 * Math.cos(i * Math.PI / 6), 22, 14 + 4 * Math.sin(i * Math.PI / 6)])]) },
    { t: 'trois tiges montent', ...garden(false) },
    { t: 'les fleurs s’ouvrent', ...garden(true) },
    { t: 'les pétales tombent sur le palais', ...all(grid(100, 44, (x, z) => [x + (rnd() - .5) * 1.4, 0, z]).map((p, i) => [p[0], 8 + ((i * 37) % 23) * 2.2, 2 + p[2] * .7]), (p, i) => [PNK, RED, WH, PNK][i % 4]), anim: (p, t) => [p[0] + 1.2 * Math.sin(t * .8 + p[1]), p[1] + .9 * Math.sin(t * .6 + p[0] * .3), p[2]] },
    { t: '2026', ...date('2026') }] } };

// ---------------------------------------------------------------- 4. affectation, contrôles, trajectoires
function order(P) { return P.map((p, i) => i).sort((a, b) => (P[a][0] - P[b][0]) || (P[a][1] - P[b][1])); }
function minSep(P) { const cell = 3, H = new Map(); let m = 1e9; P.forEach((p, i) => { const k = [0, 1, 2].map(j => Math.floor(p[j] / cell));
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) for (const j of H.get(`${k[0] + a},${k[1] + b},${k[2] + c}`) || []) m = Math.min(m, Math.hypot(p[0] - P[j][0], p[1] - P[j][1], p[2] - P[j][2]));
    const key = k.join(','); (H.get(key) || H.set(key, []).get(key)).push(i); }); return m; }
function prepare(show) { const T = show.tabs; let t0 = 0;
  T.forEach(tb => { const o = order(tb.P); tb.Q = []; tb.K = []; o.forEach((src, rank) => { tb.Q[rank] = tb.P[src]; tb.K[rank] = tb.C[src]; }); tb.sep = minSep(tb.P); });
  T.forEach((tb, k) => { const nx = T[(k + 1) % T.length]; let d = 0; for (let i = 0; i < N; i++) d = Math.max(d, Math.hypot(tb.Q[i][0] - nx.Q[i][0], tb.Q[i][1] - nx.Q[i][1], tb.Q[i][2] - nx.Q[i][2]));
    tb.move = Math.max(5, d / VMAX); tb.v = d / tb.move; tb.t0 = t0; t0 += HOLD + tb.move; });
  show.dur = t0; show.sep = Math.min(...T.map(t => t.sep)); show.v = Math.max(...T.map(t => t.v)); }
Object.values(SHOWS).forEach(prepare);
let cur = SHOWS[Q.get('show')] ? Q.get('show') : 'souffle', time = +(Q.get('t') || 0), playing = true, last = performance.now();
function select(s) { cur = s; time = 0; document.querySelectorAll('#bar [data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s)); const S = SHOWS[s];
  $('top').textContent = `Palais Brongniart · ${S.name} · le soir de l’ouverture`;
  $('chk').innerHTML = `<b>${N.toLocaleString('fr-FR')}</b> drones · <b>${S.tabs.length}</b> tableaux · <b>${Math.round(S.dur)}</b> s<br>écart mini en tableau <b class="${S.sep < SEP ? 'bad' : ''}">${S.sep.toFixed(1).replace('.', ',')} m</b><br>vitesse max <b class="${S.v > VMAX + .01 ? 'bad' : ''}">${S.v.toFixed(1).replace('.', ',')} m/s</b>`; }
function frame(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SHOWS[cur]; if (playing) time = (time + dt) % S.dur;
  let k = S.tabs.length - 1; while (k > 0 && S.tabs[k].t0 > time) k--; const A = S.tabs[k], Bn = S.tabs[(k + 1) % S.tabs.length], u = time - A.t0, s = u < HOLD ? 0 : (x => x * x * (3 - 2 * x))((u - HOLD) / A.move);
  for (let i = 0; i < N; i++) { let p = A.anim ? A.anim(A.Q[i], time) : A.Q[i], q = s ? (Bn.anim ? Bn.anim(Bn.Q[i], time) : Bn.Q[i]) : p; const lift = s ? Math.sin(Math.PI * s) * 2.5 * ((i % 7) / 7 - .3) : 0;
    pos[i * 3] = p[0] + (q[0] - p[0]) * s; pos[i * 3 + 1] = p[1] + (q[1] - p[1]) * s + lift; pos[i * 3 + 2] = p[2] + (q[2] - p[2]) * s;
    const tw = .82 + .18 * Math.sin(now * .004 + i * 1.7); for (let j = 0; j < 3; j++) col[i * 3 + j] = (A.K[i][j] + (Bn.K[i][j] - A.K[i][j]) * s) * tw; }
  geo.attributes.position.needsUpdate = geo.attributes.color.needsUpdate = true;
  $('tab').innerHTML = `<small>tableau ${k + 1} / ${S.tabs.length}${s ? ' · en vol' : ''}</small>${(s > .5 ? Bn : A).t}`; $('tl').value = Math.round(time / S.dur * 1000);
  $('clock').textContent = `${Math.floor(time / 60)}:${String(Math.floor(time % 60)).padStart(2, '0')} / ${Math.floor(S.dur / 60)}:${String(Math.floor(S.dur % 60)).padStart(2, '0')}`;
  camera.position.x = -14 + 16 * Math.sin(now * .00006); controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame); }
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Lecture'; };
$('tl').oninput = e => { time = e.target.value / 1000 * SHOWS[cur].dur; };
document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => select(b.dataset.s));
$('exp').onclick = () => { const S = SHOWS[cur], rows = ['spectacle;tableau;titre;debut_s;tenue_s;vol_s;drone;x_m;y_m;z_m;r;g;b'];
  S.tabs.forEach((tb, k) => tb.Q.forEach((p, i) => rows.push([cur, k + 1, tb.t, tb.t0.toFixed(1), HOLD, tb.move.toFixed(1), i + 1, ...p.map(v => v.toFixed(2)), ...tb.K[i].map(v => Math.round(v * 255))].join(';'))));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' })); a.download = `brongniart_drones_${cur}.csv`; a.click(); };
addEventListener('keydown', e => { if (e.key === ' ') { $('play').click(); e.preventDefault(); } if (['1', '2', '3'].includes(e.key)) select(Object.keys(SHOWS)[+e.key - 1]);
  if (['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Escape'].includes(e.key) && parent !== window) parent.dispatchEvent(new KeyboardEvent('keydown', { key: e.key })); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.DRONES = { SHOWS, N }; select(cur); time = +(Q.get('t') || 0); requestAnimationFrame(frame);
</script>
</body>
</html>
